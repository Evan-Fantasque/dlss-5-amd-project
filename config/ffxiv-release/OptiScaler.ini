; FFXIV release defaults. The installer backs up and replaces existing settings.
; Select DLSS in the GAME graphics options. Insert opens the full Chinese menu.
; Restart the game after changing the upscaling ratio / DRS overrides.
[Upscalers]
Dx11Upscaler=ffx_12

[UpscaleRatio]
UpscaleRatioOverrideEnabled=true
UpscaleRatioOverrideValue=1.3

[QualityOverrides]
QualityRatioOverrideEnabled=false

[DRS]
DrsMinOverrideEnabled=true
DrsMaxOverrideEnabled=true

[DlssNr]
Enabled=true
RunBeforeSR=true
AmdModelScale=0.75
Passes=1
LocalTone=0.0
LocalStructure=1.0
SkinStructure=-1.0
AutoCapture=false

[FrameGen]
Enabled=false
FGInput=Upscaler
FGOutput=FSRFG

[Log]
LogToFile=false
LogLevel=6
LogToConsole=false
LogToDebug=false
LogToNGX=false
OpenConsole=false
