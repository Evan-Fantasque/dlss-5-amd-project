; FFXIV first-install upscaling defaults. Other options use plugin defaults.
; Existing installations: keep your INI and adjust ratio and DRS in the full menu.
; Save and restart the game after changing the ratio or DRS settings.
[UpscaleRatio]
UpscaleRatioOverrideEnabled=true
UpscaleRatioOverrideValue=1.3

[QualityOverrides]
QualityRatioOverrideEnabled=false

[DRS]
DrsMinOverrideEnabled=true
DrsMaxOverrideEnabled=true
